services:
  datalom:
    build: .
    image: datalom:local
    ports:
      - '127.0.0.1:4317:4317'
    environment:
      DATALOM_DATA_DIR: /data
      HOST: 0.0.0.0
    volumes:
      - datalom-data:/data
    restart: unless-stopped
  worker:
    build: .
    image: datalom:local
    command: ['node', 'apps/worker/dist/main.js']
    environment:
      DATALOM_DATA_DIR: /data
    volumes:
      - datalom-data:/data
    restart: unless-stopped

volumes:
  datalom-data:
