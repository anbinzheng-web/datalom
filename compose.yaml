services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datalom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datalom}
      POSTGRES_DB: ${POSTGRES_DB:-datalom}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  schema:
    build: .
    image: datalom:local
    command: ['node_modules/.bin/prisma', 'db', 'push']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-datalom}:${POSTGRES_PASSWORD:-datalom}@postgres:5432/${POSTGRES_DB:-datalom}
    depends_on:
      postgres:
        condition: service_healthy
  datalom:
    build: .
    image: datalom:local
    ports:
      - '127.0.0.1:4317:4317'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-datalom}:${POSTGRES_PASSWORD:-datalom}@postgres:5432/${POSTGRES_DB:-datalom}
      DATALOM_DATA_DIR: /data
      HOST: 0.0.0.0
    depends_on:
      schema:
        condition: service_completed_successfully
    volumes:
      - datalom-data:/data
    restart: unless-stopped
  worker:
    build: .
    image: datalom:local
    command: ['node', 'apps/worker/dist/main.js']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-datalom}:${POSTGRES_PASSWORD:-datalom}@postgres:5432/${POSTGRES_DB:-datalom}
      DATALOM_DATA_DIR: /data
    depends_on:
      schema:
        condition: service_completed_successfully
    volumes:
      - datalom-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  datalom-data:
